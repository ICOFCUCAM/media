# Local dev infra: Postgres + Redis + MinIO (S3). GPU work is mocked locally.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cineforge
      POSTGRES_PASSWORD: cineforge
      POSTGRES_DB: cineforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Creates the bucket on startup.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 1; done;
      mc mb -p local/cineforge-assets;
      mc anonymous set download local/cineforge-assets;
      exit 0;
      "

  # The worker — Director + BullMQ pipeline. Enable with: `docker compose --profile worker up`.
  # Run migrations first: `pnpm db:migrate` (or `prisma migrate deploy`) against postgres.
  worker:
    profiles: ["worker"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://cineforge:cineforge@postgres:5432/cineforge
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: cineforge-assets
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_FORCE_PATH_STYLE: "true"
    # AI keys + GPU/provider URLs (ANTHROPIC_API_KEY, OPENAI_API_KEY,
    # EXTERNAL_VIDEO_*, WAN/HUNYUAN_GPU_URL, ASSET_PUBLIC_BASE_URL) come from .env.
    env_file:
      - .env
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
