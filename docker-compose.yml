# Local dev infra: Postgres + Redis + MinIO (S3). GPU work is mocked locally.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cineforge
      POSTGRES_PASSWORD: cineforge
      POSTGRES_DB: cineforge
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # Creates the bucket on startup.
  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 1; done;
      mc mb -p local/cineforge-assets;
      mc anonymous set download local/cineforge-assets;
      exit 0;
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
