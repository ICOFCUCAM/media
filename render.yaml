# Render blueprint — deploy the Cineforge worker + a managed Redis (Key Value).
# Web runs on Vercel; this hosts the background pipeline. Push to GitHub, then
# "New > Blueprint" in Render and point it at this repo.
#
# Secret/connection env vars are marked `sync: false` — set them in the Render
# dashboard after the first deploy (DATABASE_URL = the Supabase pooled Postgres
# string; S3_* = your bucket; the AI/provider keys to actually generate media).
# Run DB migrations once against DATABASE_URL: `prisma migrate deploy`.
services:
  - type: worker
    name: cineforge-worker
    runtime: docker
    dockerfilePath: ./apps/worker/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: cineforge-redis
          property: connectionString
      - key: DATABASE_URL # Supabase pooled Postgres connection string
        sync: false
      - key: ANTHROPIC_API_KEY # Director
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-4-8
      - key: OPENAI_API_KEY # seed frames + narration
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1
      - key: OPENAI_TTS_MODEL
        value: tts-1
      - key: OPENAI_TTS_VOICE
        value: onyx
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: us-east-1
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE # required for Supabase Storage's S3 endpoint
        value: "true"
      - key: ASSET_PUBLIC_BASE_URL # so providers can fetch seed frames / ref videos
        sync: false
      # Video model — drop-in external provider OR self-hosted Wan/Hunyuan.
      - key: EXTERNAL_VIDEO_API_URL
        sync: false
      - key: EXTERNAL_VIDEO_API_KEY
        sync: false
      - key: WAN_GPU_URL
        sync: false
      - key: HUNYUAN_GPU_URL
        sync: false
      - key: RUNPOD_API_KEY
        sync: false
      # Media Runtime Gateway (docs/39): signing key for GPU execution tokens,
      # global mode floor (report|enforce) and upload URL kind (s3|supabase).
      - key: GPU_JWT_SIGNING_KEY
        sync: false
      - key: GPU_GATEWAY_MODE
        value: report
      - key: GPU_UPLOAD_URL_MODE
        value: s3
      # GPU auto start/stop (docs/23): pod sleeps when idle, wakes on work.
      - key: RUNPOD_WAN_POD_ID
        sync: false
      - key: GPU_IDLE_GRACE_SEC
        sync: false
      # Cinematic tier (fal.ai): frontier video + voice clone + TTS + avatars.
      - key: FAL_KEY
        sync: false
      - key: FAL_T2V_MODEL
        sync: false
      - key: FAL_I2V_MODEL
        sync: false
      - key: FAL_AVATAR_MODEL
        sync: false
      # Video-to-video (variations/restyle of an uploaded clip); default Luma Ray-2 Modify.
      - key: FAL_V2V_MODEL
        sync: false
      # Multilingual export (docs/29): e.g. "fr,sw,no" — unset disables dubbing.
      - key: LOCALIZATION_LANGUAGES
        sync: false
      # Cost guardrails (docs/33): all optional, sane defaults in code.
      - key: AVATAR_MAX_CHARS
        sync: false
      - key: AVATAR_MAX_PER_DAY
        sync: false
      - key: VOICEOVER_MAX_CHARS
        sync: false
      # Social publishing (docs/31): per-platform credentials, all optional.
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
      - key: TIKTOK_ACCESS_TOKEN
        sync: false
      - key: IG_USER_ID
        sync: false
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: FB_PAGE_ID
        sync: false
      - key: FB_PAGE_TOKEN
        sync: false
      # Per-character LoRA trainer (optional — tightest identity lock).
      - key: LORA_TRAINER_URL
        sync: false
      - key: LORA_TRAINER_KEY
        sync: false

  - type: keyvalue
    name: cineforge-redis
    plan: free # 25 MB, no persistence — fine for the job queue at low volume
    maxmemoryPolicy: noeviction # BullMQ requires noeviction
    ipAllowList: [] # internal access only
