name: Build GPU worker image

# Builds apps/gpu-worker (Wan 2.1 inference service) and pushes it to Docker Hub
# so it can be deployed on a RunPod GPU pod. Triggered manually (Actions tab →
# Run workflow) or via the API. Requires two repo secrets:
#   DOCKERHUB_USERNAME  — your Docker Hub username (e.g. icofcucam)
#   DOCKERHUB_TOKEN     — a Docker Hub access token with Read & Write
on:
  push:
    branches: [claude/sleepy-johnson-8fu6b3]
    paths:
      - "apps/gpu-worker/**"
      - ".github/workflows/build-gpu-worker.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: false
        default: "latest"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Trim whitespace/newlines from the secrets (a trailing newline pasted
        # into the secret produces "malformed HTTP Authorization header"), then
        # log in via stdin so buildx picks up the credentials.
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          # Keep ONLY characters valid in a Docker Hub username / PAT, dropping
          # any stray Unicode (em-dash, zero-width/non-breaking space, etc.) that
          # a paste can sneak in and which breaks the Authorization header.
          user="$(printf '%s' "$DH_USER" | tr -cd 'A-Za-z0-9._-')"
          token="$(printf '%s' "$DH_TOKEN" | tr -cd 'A-Za-z0-9_-')"
          echo "cleaned username length=${#user} token length=${#token}"
          printf '%s' "$token" | docker login -u "$user" --password-stdin

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          # Context = the gpu-worker dir, since the Dockerfile COPYs
          # requirements.txt / app relative to that dir (not the repo root).
          context: ./apps/gpu-worker
          file: apps/gpu-worker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
          # Every build also gets an immutable `sha-<commit>` tag (docs/39 rollout
          # R0): pin the RunPod pod to it so a merge never reaches production
          # until the pod's image tag is changed on purpose.
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cineforge-gpu:${{ inputs.tag || 'latest' }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cineforge-gpu:sha-${{ github.sha }}

      # The immutable reference to approve and pin (docs/39): repo@sha256:<digest>.
      - name: Record image digest
        run: |
          echo "### GPU worker image" >> "$GITHUB_STEP_SUMMARY"
          echo "Pin and approve: \`cineforge-gpu@${{ steps.build.outputs.digest }}\` (source ${{ github.sha }})" >> "$GITHUB_STEP_SUMMARY"

# re-run trigger
