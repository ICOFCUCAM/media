name: Build GPU worker image

# Builds apps/gpu-worker (Wan 2.1 inference service) and pushes it to Docker Hub
# so it can be deployed on a RunPod GPU pod. Triggered manually (Actions tab →
# Run workflow) or via the API. Requires two repo secrets:
#   DOCKERHUB_USERNAME  — your Docker Hub username (e.g. icofcucam)
#   DOCKERHUB_TOKEN     — a Docker Hub access token with Read & Write
on:
  push:
    branches: [claude/sleepy-johnson-8fu6b3]
    paths:
      - "apps/gpu-worker/**"
      - ".github/workflows/build-gpu-worker.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag"
        required: false
        default: "latest"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          df -h /

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Trim whitespace/newlines from the secrets (a trailing newline pasted
        # into the secret produces "malformed HTTP Authorization header"), then
        # log in via stdin so buildx picks up the credentials.
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          user="$(printf '%s' "$DH_USER" | tr -d '[:space:]')"
          printf '%s' "$DH_TOKEN" | tr -d '[:space:]' | docker login -u "$user" --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/gpu-worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cineforge-gpu:${{ inputs.tag || 'latest' }}
