name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager"; setting it here too
      # makes the action refuse to run.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Typecheck and build need the generated Prisma client types.
      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate Prisma schema
        run: pnpm --filter @cineforge/db prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/cineforge

      # DirectorOS W1 (DOS-72/73/74): no hidden TODOs in production source, no
      # unreviewed substitute switches, no maturity claim without evidence.
      - name: Truth gate
        run: node scripts/check-truth.mjs && node --test scripts/check-truth.test.mjs

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  gpu-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gpu-worker deps
        run: pip install -r apps/gpu-worker/requirements.txt -r apps/gpu-worker/requirements-dev.txt
      - name: Import check
        run: python -c "import app.server"
        working-directory: apps/gpu-worker
      - name: Gateway security tests
        run: python -m pytest -q
        working-directory: apps/gpu-worker

  # docs/39 PR 2 acceptance: the real GPU worker in GATEWAY_MODE=enforce,
  # driven by the real TypeScript Gateway Authority (happy path + rejections).
  gateway-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install gpu-worker runtime deps (no ML stack needed in placeholder mode)
        run: pip install fastapi==0.111.0 "uvicorn[standard]==0.30.0" pydantic==2.7.0 "PyJWT[crypto]==2.9.0"
      - name: Install ffmpeg (placeholder clips)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Gateway end-to-end acceptance
        run: pnpm --filter @cineforge/model-adapters exec vitest run e2e
        env:
          GATEWAY_E2E: "1"

  # The GPU image verifier end-to-end: a slim stand-in image is pushed to a
  # local registry and verified by digest (must pass), then a tampered copy
  # with one changed source file (must fail on contents).
  gpu-image-verifier:
    runs-on: ubuntu-latest
    services:
      registry:
        image: registry:2
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "PyJWT[crypto]==2.9.0"
      - name: Verified image passes
        run: |
          commit="$(git rev-parse HEAD)"
          docker build -q -f apps/gpu-worker/tests/fixtures/verify/Dockerfile \
            --build-arg SOURCE_COMMIT="$commit" -t localhost:5000/cineforge-gpu-verify:good apps/gpu-worker
          docker push -q localhost:5000/cineforge-gpu-verify:good
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' localhost:5000/cineforge-gpu-verify:good)"
          docker rmi -f localhost:5000/cineforge-gpu-verify:good >/dev/null
          python3 apps/gpu-worker/scripts/verify_image.py "$ref" --expect-commit "$commit" --report good.json
      - name: Tampered image fails
        run: |
          commit="$(git rev-parse HEAD)"
          rm -rf /tmp/tampered && cp -r apps/gpu-worker /tmp/tampered
          echo "# not from git" >> /tmp/tampered/app/server.py
          docker build -q -f apps/gpu-worker/tests/fixtures/verify/Dockerfile \
            --build-arg SOURCE_COMMIT="$commit" -t localhost:5000/cineforge-gpu-verify:tampered /tmp/tampered
          docker push -q localhost:5000/cineforge-gpu-verify:tampered
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' localhost:5000/cineforge-gpu-verify:tampered)"
          if python3 apps/gpu-worker/scripts/verify_image.py "$ref" --report bad.json; then
            echo "tampered image was VERIFIED"; exit 1
          fi
          python3 -c "import json,sys; r=json.load(open('bad.json')); bad=[c['name'] for c in r['checks'] if not c['ok']]; print(bad); sys.exit(0 if any(n.startswith('contents') for n in bad) else 1)"
      - name: Mutable references are refused
        run: |
          if python3 apps/gpu-worker/scripts/verify_image.py localhost:5000/cineforge-gpu-verify:good; then exit 1; fi

  # Migrations 0026+ applied in order to a scratch Postgres, each followed by
  # its validation script (every new migration must ship one).
  migration-0026:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Apply 0026 + 0027 and run their validation
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f packages/db/supabase/tests/supabase-stubs.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f packages/db/supabase/migrations/0026_runtime_gateway.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f packages/db/supabase/tests/0026_runtime_gateway.test.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -f packages/db/supabase/migrations/0027_character_lora_sha256.sql
          psql "$PGURL" -v ON_ERROR_STOP=1 -f packages/db/supabase/tests/0027_character_lora_sha256.test.sql
      - name: Apply 0028+ (Phase 4 data model) and run their validation
        run: |
          for m in packages/db/supabase/migrations/002[89]_*.sql packages/db/supabase/migrations/003*_*.sql; do
            [ -f "$m" ] || continue
            psql "$PGURL" -v ON_ERROR_STOP=1 -q -f "$m"
            t="packages/db/supabase/tests/$(basename "$m" .sql).test.sql"
            [ -f "$t" ] || { echo "missing validation script $t"; exit 1; }
            psql "$PGURL" -v ON_ERROR_STOP=1 -f "$t"
          done
      # The Prisma models the worker writes through must match the SQL.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @cineforge/db...
      - name: Prisma models match the migrations
        run: packages/db/scripts/check-prisma-vs-migrations.sh
        env:
          DATABASE_URL: ${{ env.PGURL }}
      # §62.9 on a real database through the real Prisma client: a canon
      # change resets exactly the affected shots (separate scratch database).
      - name: Canon revision on a real database
        run: |
          psql "$PGURL" -v ON_ERROR_STOP=1 -q -c "create database cf_it"
          pnpm install --frozen-lockfile --filter @cineforge/worker...
          pnpm db:generate
          DATABASE_URL="$IT_URL" pnpm --filter @cineforge/db exec prisma db push --skip-generate
          DB_INTEGRATION=1 DATABASE_URL="$IT_URL" pnpm --filter @cineforge/worker exec vitest run src/canon/revision.db.test.ts
        env:
          IT_URL: postgresql://postgres:postgres@localhost:5432/cf_it

  # docs/38 §AW.11 regression test 1 with real FFmpeg and real media: narration
  # is never cut to the picture, and a short narration never cuts the picture.
  media-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Media regression tests
        run: pnpm --filter @cineforge/worker exec vitest run src/ffmpeg src/avsync
        env:
          REQUIRE_FFMPEG: "1"
